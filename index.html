<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Church Signage CMS</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
    <div v-if="loading" class="login-page">
        <div class="spinner-border text-light" role="status"></div>
    </div>

    <login v-else-if="!authenticated" @login="handleLogin"></login>

    <template v-else>
        <div class="app-layout">
            <sidebar :current="currentRoute" :user="user" @navigate="navigate" @logout="handleLogout"></sidebar>
            <main class="main-content">
                <component :is="pageComponent"></component>
            </main>
        </div>
    </template>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="js/api.js"></script>
<script src="js/components/Login.js"></script>
<script src="js/components/Sidebar.js"></script>
<script src="js/components/Dashboard.js"></script>
<script src="js/components/MediaManager.js"></script>
<script src="js/components/PlaylistManager.js"></script>
<script src="js/components/DeviceManager.js"></script>
<script src="js/components/PlayerPreview.js"></script>
<script src="js/app.js"></script>
</body>
</html>
